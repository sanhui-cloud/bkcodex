[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bkcodex"
version = "0.1.0"
description = "Persistent, isolated Codex CLI workers with a file-backed task queue"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bkcodex = "bkcodex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
